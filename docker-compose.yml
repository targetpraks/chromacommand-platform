version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chromacommand
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  mqtt:
    build:
      context: .
      dockerfile: docker/Dockerfile.mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt_data:/mosquitto/data

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chromacommand
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd /app/packages/database && npx tsx seed.ts"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chromacommand
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL: ${JWT_TTL:-1h}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      MQTT_BROKER_URL: mqtt://mqtt:1883
      DASHBOARD_ORIGIN: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@chromacommand.local}
      NODE_ENV: development
    depends_on:
      - seed
      - mqtt
    command: npm run dev --workspace=@chromacommand/api

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chromacommand.rule=Host(`o3oc10fm2z0gzffee963rmkx.192.168.0.154.sslip.io`)"
      - "traefik.http.routers.chromacommand.entryPoints=http"
      - "traefik.http.services.chromacommand.loadbalancer.server.port=3000"
    depends_on:
      - api
    command: npm run dev --workspace=@chromacommand/dashboard

  # Per-store edge gateway for local end-to-end testing.
  # In dev the "local device bus" is the same broker as the cloud one.
  # Comment out when iterating on cloud services only.
  edge-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge-gateway
    network_mode: host
    environment:
      STORE_ID: pp-a01
      REGION_ID: cape-town
      MQTT_BROKER_URL: mqtt://localhost:1883
      LOCAL_MQTT_URL: mqtt://localhost:1883
      DB_PATH: /data/edge_cache.db
      HEARTBEAT_INTERVAL: 30000
    volumes:
      - edge_data:/data
    depends_on:
      - mqtt

volumes:
  edge_data:
  postgres_data:
  redis_data:
  mqtt_data:
